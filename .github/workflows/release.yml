# Builds Readmark for macOS and Windows on GitHub's servers and attaches the
# installers to a draft GitHub Release.
#
# How to make a release:
#   1. Set the new version in package.json, src-tauri/Cargo.toml and
#      src-tauri/tauri.conf.json (e.g. 0.2.0), commit and push.
#   2. Tag the commit and push the tag:
#        git tag v0.2.0 && git push origin v0.2.0
#   3. Wait for the builds (Actions tab), check the draft under Releases,
#      then press "Publish release".

name: Release

on:
  push:
    tags: ["v*"] # runs when a tag like v0.2.0 is pushed
  workflow_dispatch: # also allows starting it by hand from the Actions tab

jobs:
  build:
    # The job runs once per entry in the matrix below, each on its own machine.
    strategy:
      fail-fast: false # one platform failing doesn't cancel the others
      matrix:
        include:
          - name: macOS (Apple Silicon)
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write # needed to create the release and upload files

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the version in tauri.conf.json (${version})."
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build output (makes later runs much faster)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build the app and upload it to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided automatically by GitHub
        with:
          tagName: v__VERSION__ # __VERSION__ is replaced with the app version
          releaseName: Readmark v__VERSION__
          releaseDraft: true # you review and publish it yourself
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ## Download

            - **macOS, Apple Silicon (M1 and newer):** `Readmark_*_aarch64.dmg`
            - **macOS, Intel:** `Readmark_*_x64.dmg`
            - **Windows:** `Readmark_*_x64-setup.exe`

            ## First launch

            Readmark isn't signed with a paid developer certificate yet, so your system will warn you the first time:

            - **macOS:** open the app once, then go to **System Settings → Privacy & Security** and click **Open Anyway**.
            - **Windows:** if SmartScreen appears, click **More info → Run anyway**.
