<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Readmark</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <header id="toolbar" class="toolbar">
      <button id="open-button" class="toolbar-button" type="button" title="Open file">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M3 6.5A2.5 2.5 0 0 1 5.5 4h3.6c.6 0 1.2.2 1.6.7L12 6h6.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></svg>
        <span>Open</span>
        <kbd id="open-shortcut"></kbd>
      </button>
      <div id="file-name" class="file-name"></div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </header>

    <main id="viewport" class="viewport">
      <section id="welcome" class="welcome">
        <img src="/icon.svg" alt="" width="96" height="96" />
        <h1>Readmark</h1>
        <p>Drop a Markdown file here, or press <kbd class="open-shortcut-text"></kbd> to open one.</p>
      </section>
      <article id="document" class="document" hidden></article>
    </main>

    <div id="drop-overlay" class="drop-overlay" hidden>
      <div>Drop to open</div>
    </div>
  </body>
</html>
